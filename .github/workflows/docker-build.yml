name: Build and Push Docker Image

on:
  push:
    branches: [ "feature/12.0_unstable", "main" ]
    tags: [ "[0-9]*.*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: tags
        run: |
          BASE="ghcr.io/dumbkid234/jellyfin.pgsql"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            JF_VER="${TAG%%-*}"
            echo "jf_ver=${JF_VER}" >> "$GITHUB_OUTPUT"
            {
              echo "list<<EOF"
              echo "${BASE}:${TAG}"
              echo "${BASE}:${JF_VER}"
              echo "${BASE}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "jf_ver=12.4" >> "$GITHUB_OUTPUT"
            {
              echo "list<<EOF"
              echo "${BASE}:12.4"
              echo "${BASE}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.list }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          body: |
            ## Docker Image
            ~~~bash
            docker pull ghcr.io/dumbkid234/jellyfin.pgsql:${{ github.ref_name }}
            docker pull ghcr.io/dumbkid234/jellyfin.pgsql:${{ steps.tags.outputs.jf_ver }}
            ~~~
